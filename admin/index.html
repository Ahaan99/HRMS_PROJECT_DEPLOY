<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" className="rounded-full" href="/logo.jpeg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Super Admin | HRMS</title>
    <meta
      name="description"
      content="Super Admin dashboard to manage HR, leads, employees, and operations in HRMS system."
    />
    <meta
      name="keywords"
      content="HRMS, Admin Dashboard, Lead Management, Employee Management, CRM"
    />
    <meta name="author" content="Your Company Name" />

    <!-- Open Graph (for sharing) -->
    <meta property="og:title" content="Super Admin Dashboard | HRMS" />
    <meta
      property="og:description"
      content="Manage leads, HR, and employees with powerful admin tools."
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Theme color (mobile UI color) -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- Dark mode: apply saved/system theme BEFORE React loads (no white flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hrms-theme");
          var dark =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
