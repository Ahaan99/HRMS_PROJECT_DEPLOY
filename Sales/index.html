<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Sales Dashboard | HRMS</title>
    <meta
      name="description"
      content="Sales dashboard to manage leads, track conversions, and update daily progress in HRMS."
    />
    <meta
      name="keywords"
      content="Sales Dashboard, Lead Tracking, CRM, HRMS, Sales Management"
    />
    <meta name="author" content="Your Company Name" />

    <!-- Open Graph -->
    <meta property="og:title" content="Sales Dashboard | HRMS" />
    <meta
      property="og:description"
      content="Track leads, update status, and manage sales performance."
    />
    <meta property="og:image" content="/logo.jpeg" />
    <meta property="og:type" content="website" />

    <!-- Block indexing (important for dashboards) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Theme color -->
    <meta name="theme-color" content="#4f46e5" />
    <script>
      // Apply saved theme before React loads to prevent white flash
      (function () {
        try {
          var t = localStorage.getItem("hrms-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
