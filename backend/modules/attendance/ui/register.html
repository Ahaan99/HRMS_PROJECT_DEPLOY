<!DOCTYPE html>
<html lang="en" data-sa-base="/api/smart-attendance">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Attendance — Register</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#10b981;--green-dark:#059669;--blue:#38bdf8;--red:#f43f5e;--bg:#05070d;--card:#0d1322;--border:#243149;--text:#eef3fb;--muted:#8a97ad;--font-head:'Sora',sans-serif;--font-body:'Manrope',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.4;z-index:0}
body::after{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 40% 60%,rgba(29,158,117,.08) 0%,transparent 60%);z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:440px;padding:20px}
.logo-block{text-align:center;margin-bottom:28px}
.logo{width:52px;height:52px;background:var(--green);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:17px;font-weight:800;color:#fff;margin-bottom:12px;box-shadow:0 0 30px rgba(29,158,117,.3)}
.logo-block h1{font-family:var(--font-head);font-size:22px;font-weight:700}
.logo-block p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.role-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.role-btn{padding:11px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-body);font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.role-btn.active-admin{background:rgba(55,138,221,.12);border-color:var(--blue);color:var(--blue)}
.role-btn.active-emp{background:rgba(29,158,117,.12);border-color:var(--green);color:var(--green)}
.field-group{margin-bottom:14px}
.field-group label{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:5px;letter-spacing:.3px;text-transform:uppercase}
.field-group input{width:100%;padding:11px 13px;background:#121a2e;border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:var(--font-body);font-size:14px;outline:none;transition:.2s}
.field-group input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.field-group input::placeholder{color:#3A3F4E}
.field-group.hidden{display:none}
.btn-primary{width:100%;padding:13px;border:none;border-radius:10px;font-family:var(--font-head);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;margin-top:6px;letter-spacing:.3px}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-dark);transform:translateY(-1px)}
.msg{padding:10px 13px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.show{display:block}
.msg.error{background:rgba(216,90,48,.1);border:1px solid rgba(216,90,48,.3);color:var(--red)}
.msg.success{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.3);color:var(--green)}
.link-btn{display:block;text-align:center;color:var(--muted);font-size:13px;text-decoration:none;margin-top:16px;transition:.2s}
.link-btn:hover{color:var(--text)}
.link-btn span{color:var(--green)}
.fade-in{animation:fadeIn .4s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* === v0 premium polish layer === */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.28);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.5)}
body{background-image:radial-gradient(1100px 480px at 50% -10%,rgba(56,189,248,.08),transparent 60%),radial-gradient(800px 380px at 100% 112%,rgba(16,185,129,.06),transparent 55%);background-attachment:fixed}
button,.btn,[class*="btn"]{transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
button:hover,.btn:hover,[class*="btn"]:hover{transform:translateY(-1px)}
button:active,.btn:active{transform:translateY(0)}
input,select,textarea{transition:border-color .16s,box-shadow .16s}
input:focus,select:focus,textarea:focus{border-color:var(--blue,#38bdf8)!important;box-shadow:0 0 0 3px rgba(56,189,248,.14)!important;outline:none}
[class*="card"]{box-shadow:0 10px 32px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.04);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
[class*="card"]:hover{border-color:rgba(56,189,248,.30)}
table tr{transition:background .14s}
h1,h2,h3{letter-spacing:-.02em}
/* === end polish === */
</style>
</head>
<body>
<div class="wrap fade-in">
  <div class="logo-block">
    <div class="logo">SA</div>
    <h1>Create Account</h1>
    <p>New account create</p>
  </div>

  <div class="card">
    <div class="role-tabs">
      <button class="role-btn active-emp" id="btn-emp" onclick="setRole('employee')">👤 Employee</button>
      <button class="role-btn" id="btn-admin" onclick="setRole('admin')">👑 Admin</button>
    </div>

    <div class="field-group">
      <label>Poora Name</label>
      <input type="text" id="name" placeholder="Apna poora naam...">
    </div>
    <div class="field-group" id="empid-group">
      <label>Employee ID</label>
      <input type="text" id="emp_id" placeholder="EMP-001, HR-042...">
    </div>
    <div class="field-group">
      <label>Mobile Number</label>
      <input type="tel" id="mobile" placeholder="10 digit mobile" maxlength="10">
    </div>
    <div class="field-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 6 characters">
    </div>
    <div class="field-group">
      <label>Password Confirm</label>
      <input type="password" id="password2" placeholder="Dobara likho...">
    </div>

    <button class="btn-primary btn-green" id="reg-btn" onclick="doRegister()">Employee Account create</button>
    <div class="msg" id="msg"></div>
  </div>

  <a href="/api/smart-attendance/" class="link-btn">← <span>Again login </span></a>
</div>

<script>
let currentRole = 'employee';

function setRole(role) {
  currentRole = role;
  document.getElementById('btn-emp').className   = role==='employee' ? 'role-btn active-emp' : 'role-btn';
  document.getElementById('btn-admin').className = role==='admin'    ? 'role-btn active-admin' : 'role-btn';
  document.getElementById('empid-group').style.display = role==='employee' ? '' : 'none';
  document.getElementById('reg-btn').textContent = role==='employee' ? 'Employee Account Banao' : 'Admin Account Banao';
  hideMsg();
}

function showMsg(msg, type) {
  const el = document.getElementById('msg');
  el.textContent = msg; el.className = `msg ${type} show`;
}
function hideMsg() { document.getElementById('msg').classList.remove('show'); }

async function doRegister() {
  const name   = document.getElementById('name').value.trim();
  const emp_id = document.getElementById('emp_id').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  const pass   = document.getElementById('password').value.trim();
  const pass2  = document.getElementById('password2').value.trim();
  const btn    = document.getElementById('reg-btn');

  if (!name || !mobile || !pass || !pass2) { showMsg('Sabhi fields bharo!', 'error'); return; }
  if (currentRole==='employee' && !emp_id) { showMsg('Employee ID chahiye!', 'error'); return; }
  if (mobile.length!==10 || isNaN(mobile)) { showMsg('10 digit mobile chahiye', 'error'); return; }
  if (pass.length < 6) { showMsg('Password min 6 chars', 'error'); return; }
  if (pass !== pass2) { showMsg('Password match nahi kiya!', 'error'); return; }

  btn.textContent = '...'; btn.disabled = true;

  try {
    const res  = await fetch('/api/smart-attendance/api/register-account', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({role:currentRole, name, emp_id, mobile, password:pass})
    });
    const data = await res.json();
    if (data.ok) {
      showMsg(data.message, 'success');
      btn.textContent = '✓ Done!';
      setTimeout(() => window.location.href='/api/smart-attendance/', 1800);
    } else {
      showMsg(data.error, 'error');
      btn.textContent = 'Account Banao'; btn.disabled = false;
    }
  } catch(e) {
    showMsg('Server error', 'error');
    btn.textContent = 'Account Banao'; btn.disabled = false;
  }
}
</script>
</body>
</html>
